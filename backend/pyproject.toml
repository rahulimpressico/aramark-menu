[project]
name = "menu-analysis-backend"
version = "0.1.0"
description = "Collegiate Dining Menu Analysis API and agent experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib>=1.7.4",
    "python-multipart>=0.0.6",
    "loguru>=0.7.0",
    "deepagents>=0.4.3",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
experiments = [
    "deepagents>=0.1.0",
    "langchain>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langgraph>=0.2.0",
    "langfuse>=2.0.0",
]
notebook = [
    "jupyter>=1.0.0",
    "ipykernel>=6.0.0",
    "networkx>=3.0",
    "matplotlib>=3.7",
    "pyvis>=0.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "experiments"]

[dependency-groups]
dev = []
